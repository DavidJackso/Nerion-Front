name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build in container
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          tags: nerion-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract static output
        run: |
          docker create --name nerion-extract nerion-build:latest
          docker cp nerion-extract:/app/.output/public ./dist
          docker rm nerion-extract

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .output/public/

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy static files
        run: |
          rsync -az --delete .output/public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/nerion/
